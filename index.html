<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIIC DTR - Reymark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --tiic-blue: #0056b3; --tiic-dark: #1a1a1a; }
        body { background-color: #f0f4f8; font-family: 'Inter', sans-serif; color: #333; }
        .app-container { max-width: 500px; margin: 0 auto; min-height: 100vh; background: white; box-shadow: 0 0 50px rgba(0,0,0,0.1); }
        .header { background: var(--tiic-blue); color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 40px 40px; }
        .status-badge { font-size: 0.7rem; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; font-weight: bold; }
        .main-card { margin-top: -30px; border-radius: 25px; border: none; }
        .btn-action { height: 150px; width: 150px; border-radius: 50%; font-weight: 800; font-size: 1.2rem; border: 10px solid #f0f4f8; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-action:disabled { opacity: 0.2; transform: scale(0.9); }
        .site-select { border: 2px solid #eee; border-radius: 15px; padding: 12px; font-weight: 600; }
        .log-row { border-left: 5px solid var(--tiic-blue); background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 0.9rem; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner-border text-primary"></div>
</div>

<div class="app-container">
    <div class="header">
        <p class="mb-1 opacity-75">TIIC IT DEPARTMENT</p>
        <h1 id="clock" class="display-4 fw-bold mb-0">00:00:00</h1>
        <p id="date" class="small opacity-75"></p>
    </div>

    <div class="container px-4">
        <div class="card main-card shadow p-4 mb-4">
            <!-- Location & Rules -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="small fw-bold text-muted">CURRENT LOCATION</label>
                    <span id="targetBadge" class="status-badge bg-primary text-white">Target: 6:06 PM</span>
                </div>
                <select id="siteSelect" class="form-select site-select">
                    <option value="BAKILID">BAKILID SITE</option>
                    <option value="iPAK">iPAK SITE</option>
                    <option value="MAIN OFFICE">MAIN OFFICE</option>
                </select>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="holidaySwitch">
                <label class="form-check-label small fw-bold" for="holidaySwitch">Holiday in this week?</label>
            </div>

            <!-- BUTTON LOGIC AREA -->
            <div class="text-center py-4" id="actionArea">
                <!-- Buttons will be injected here by JavaScript -->
                <div id="btnContainer" class="d-flex justify-content-center">
                    <button id="btnClockIn" class="btn btn-primary btn-action shadow">CLOCK<br>IN</button>
                    <button id="btnClockOut" class="btn btn-dark btn-action shadow d-none">CLOCK<br>OUT</button>
                </div>
                <div id="doneMessage" class="d-none">
                    <div class="alert alert-success border-0 rounded-4">
                        <h5 class="fw-bold mb-1">Shift Completed! ✅</h5>
                        <p class="small mb-0">You have logged your IN and OUT for today.</p>
                    </div>
                </div>
            </div>
        </div>

        <h6 class="fw-bold text-muted mb-3 px-2">RECENT ACTIVITY</h6>
        <div id="logs" class="px-2"></div>
        <p class="text-center text-muted small mt-5 pb-5">Manager: Daven Amores</p>
    </div>
</div>

<script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyDLMSpNwzh9REwoToXkERM6tz3zg_8auuI",
        authDomain: "tiic-dtr.firebaseapp.com",
        databaseURL: "https://tiic-dtr-default-rtdb.firebaseio.com",
        projectId: "tiic-dtr",
        storageBucket: "tiic-dtr.firebasestorage.app",
        messagingSenderId: "852848714796",
        appId: "1:852848714796:web:f5d648281a4dfe09275d89"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. APP STATE
    const todayStr = new Date().toLocaleDateString();
    
    // 3. UI SYNC LOGIC (The Strict Rule)
    function syncAppState() {
        db.ref('logs').orderByChild('readableDate').equalTo(todayStr).once('value', (snapshot) => {
            let hasIn = false;
            let hasOut = false;

            snapshot.forEach(child => {
                const log = child.val();
                if (log.type === "IN") hasIn = true;
                if (log.type === "OUT") hasOut = true;
            });

            // Logic Tree
            if (hasIn && hasOut) {
                // Both done
                document.getElementById('btnContainer').classList.add('d-none');
                document.getElementById('doneMessage').classList.remove('d-none');
            } else if (hasIn) {
                // Already in, show out
                document.getElementById('btnClockIn').classList.add('d-none');
                document.getElementById('btnClockOut').classList.remove('d-none');
            } else {
                // Fresh day
                document.getElementById('btnClockIn').classList.remove('d-none');
                document.getElementById('btnClockOut').classList.add('d-none');
            }
            document.getElementById('loadingOverlay').style.display = 'none';
            loadLogs();
        });
    }

    // 4. CLOCK & RULES
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        document.getElementById('date').innerText = new Date().toDateString();
    }, 1000);

    document.getElementById('holidaySwitch').onchange = function() {
        document.getElementById('targetBadge').innerText = this.checked ? "Target: 6:30 PM" : "Target: 6:06 PM";
        document.getElementById('targetBadge').className = this.checked ? "status-badge bg-warning text-dark" : "status-badge bg-primary text-white";
    };

    // 5. CLOCK ACTIONS
    async function logTime(type) {
        if (!confirm(`Confirm ${type}?`)) return;
        
        const now = new Date();
        const data = {
            readableDate: todayStr,
            readableTime: now.toLocaleTimeString(),
            timestamp: now.getTime(),
            type: type,
            site: document.getElementById('siteSelect').value,
            rule: document.getElementById('targetBadge').innerText
        };

        await db.ref('logs').push(data);
        syncAppState(); // Re-check buttons immediately
    }

    document.getElementById('btnClockIn').onclick = () => logTime("IN");
    document.getElementById('btnClockOut').onclick = () => logTime("OUT");

    // 6. HISTORY LOAD
    function loadLogs() {
        db.ref('logs').limitToLast(5).once('value', (snap) => {
            const container = document.getElementById('logs');
            container.innerHTML = "";
            snap.forEach((child) => {
                const log = child.val();
                container.innerHTML = `
                    <div class="log-row d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold">${log.type}</span> <br>
                            <small class="text-muted">${log.readableDate}</small>
                        </div>
                        <div class="text-end">
                            <span class="fw-bold text-primary">${log.readableTime}</span> <br>
                            <small class="text-muted">${log.site}</small>
                        </div>
                    </div>
                ` + container.innerHTML;
            });
        });
    }

    // Initialize
    syncAppState();
</script>

</body>
</html>
