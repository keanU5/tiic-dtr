<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIIC OJT PRO - Reymark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        :root { --tiic-blue: #0038a8; --accent: #00d2ff; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; padding-bottom: 80px; }
        
        /* Professional Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { border: none; background: none; color: #64748b; font-size: 0.75rem; text-align: center; }
        .nav-item.active { color: var(--tiic-blue); font-weight: 700; }
        .nav-item i { font-size: 1.4rem; display: block; }

        /* Dashboard Elements */
        .glass-header { background: var(--tiic-blue); background: linear-gradient(135deg, #0038a8 0%, #001a4d 100%); color: white; padding: 40px 20px 60px; border-radius: 0 0 40px 40px; }
        .stat-card { background: white; border-radius: 20px; border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 20px; margin-top: -40px; }
        .progress { height: 8px; border-radius: 10px; background: #e2e8f0; }
        .progress-bar { background: var(--accent); }

        /* Buttons */
        .btn-clock { width: 150px; height: 150px; border-radius: 50%; font-weight: 700; border: 10px solid #f1f5f9; box-shadow: 0 10px 25px rgba(0,56,168,0.2); transition: 0.3s; }
        .btn-clock:active { transform: scale(0.95); }
        
        /* History Items */
        .history-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 12px; border-left: 5px solid var(--tiic-blue); }
        
        .page-content { display: none; }
        .page-content.active { display: block; }
        #loading { position: fixed; inset: 0; background: white; z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="loading"><div class="spinner-border text-primary"></div></div>

<!-- TOP HEADER -->
<div class="glass-header text-center">
    <small class="opacity-75 tracking-widest text-uppercase fw-bold" style="font-size: 0.65rem;">TIIC Industrial Corp | IT Dept</small>
    <h1 id="clock" class="fw-bold my-2">00:00:00</h1>
    <p id="date" class="small opacity-75 mb-0"></p>
</div>

<!-- PAGE: HOME -->
<div id="homePage" class="page-content active container">
    <div class="stat-card mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">OJT Rendering Progress</h6>
            <span id="percText" class="badge bg-primary rounded-pill">0%</span>
        </div>
        <div class="progress mb-3">
            <div id="progressBar" class="progress-bar" style="width: 0%"></div>
        </div>
        <div class="row text-center mt-2">
            <div class="col-6 border-end">
                <small class="text-muted d-block">Rendered</small>
                <span id="renderedHrs" class="fw-bold text-dark">0h</span>
            </div>
            <div class="col-6">
                <small class="text-muted d-block">Remaining</small>
                <span id="remainingHrs" class="fw-bold text-primary">480h</span>
            </div>
        </div>
    </div>

    <!-- Clocking Logic -->
    <div id="actionBox" class="card shadow-sm border-0 p-4 mb-4 rounded-4 text-center">
        <p id="statusMsg" class="text-muted small mb-4">You haven't clocked in for today.</p>
        <div class="d-flex justify-content-center">
            <button id="btnIn" class="btn btn-primary btn-clock">CLOCK IN</button>
            <button id="btnOut" class="btn btn-dark btn-circle btn-clock d-none">CLOCK OUT</button>
        </div>
        <div id="completedDay" class="d-none">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
            <h5 class="fw-bold mt-2">Duty Finished</h5>
            <p id="dailySummary" class="text-muted small"></p>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-6">
            <div class="card border-0 shadow-sm p-3 rounded-4">
                <small class="text-muted d-block fw-bold">LOCATION</small>
                <select id="siteSelect" class="form-select border-0 ps-0 fw-bold">
                    <option>BAKILID SITE</option>
                    <option>iPAK SITE</option>
                    <option>MAIN OFFICE</option>
                </select>
            </div>
        </div>
        <div class="col-6">
            <div class="card border-0 shadow-sm p-3 rounded-4">
                <small class="text-muted d-block fw-bold">RULE</small>
                <select id="ruleSelect" class="form-select border-0 ps-0 fw-bold">
                    <option value="6:06 PM">Standard (6:06)</option>
                    <option value="6:30 PM">Holiday (6:30)</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- PAGE: HISTORY -->
<div id="historyPage" class="page-content container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold mb-0">Attendance Log</h5>
        <button onclick="exportData()" class="btn btn-sm btn-outline-primary rounded-pill px-3">Export</button>
    </div>
    <div id="historyList"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="showPage('homePage', this)">
        <i class="bi bi-house-door-fill"></i>Home
    </button>
    <button class="nav-item" onclick="showPage('historyPage', this)">
        <i class="bi bi-calendar-check"></i>History
    </button>
</nav>

<script>
    // 1. CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyDLMSpNwzh9REwoToXkERM6tz3zg_8auuI",
        authDomain: "tiic-dtr.firebaseapp.com",
        databaseURL: "https://tiic-dtr-default-rtdb.firebaseio.com",
        projectId: "tiic-dtr",
        storageBucket: "tiic-dtr.firebasestorage.app",
        messagingSenderId: "852848714796",
        appId: "1:852848714796:web:f5d648281a4dfe09275d89"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const OJT_GOAL = 480; // Total required hours

    // 2. APP LOGIC
    function showPage(id, el) {
        document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        document.getElementById('date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);

    // 3. CORE CALCULATION ENGINE
    async function refreshApp() {
        const todayStr = new Date().toLocaleDateString();
        db.ref('logs').once('value', (snapshot) => {
            let allLogs = [];
            let totalRenderedMs = 0;
            let todayIn = null;
            let todayOut = null;

            snapshot.forEach(child => {
                const log = child.val();
                allLogs.push(log);
            });

            // Group logs by date to calculate hours
            const grouped = allLogs.reduce((acc, log) => {
                if (!acc[log.readableDate]) acc[log.readableDate] = {};
                acc[log.readableDate][log.type] = log.timestamp;
                return acc;
            }, {});

            let historyHTML = "";
            Object.keys(grouped).sort((a,b) => new Date(b) - new Date(a)).forEach(date => {
                const day = grouped[date];
                let hrs = 0;
                if (day.IN && day.OUT) {
                    let diff = day.OUT - day.IN;
                    hrs = (diff / (1000 * 60 * 60));
                    if (hrs > 5) hrs -= 1; // Subtract 1hr for lunch
                    totalRenderedMs += hrs;
                }

                historyHTML += `
                    <div class="history-card shadow-sm">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-muted fw-bold">${date}</small>
                                <div class="fw-bold text-dark mt-1">
                                    ${day.IN ? new Date(day.IN).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '--'} 
                                    → 
                                    ${day.OUT ? new Date(day.OUT).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '--'}
                                </div>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-light text-primary border">${hrs.toFixed(2)} hrs</span>
                            </div>
                        </div>
                    </div>`;
                
                if (date === todayStr) {
                    todayIn = day.IN;
                    todayOut = day.OUT;
                }
            });

            // Update UI
            document.getElementById('historyList').innerHTML = historyHTML;
            const totalHrs = totalRenderedMs;
            document.getElementById('renderedHrs').innerText = totalHrs.toFixed(1) + "h";
            document.getElementById('remainingHrs').innerText = Math.max(0, OJT_GOAL - totalHrs).toFixed(1) + "h";
            const perc = Math.min(100, (totalHrs / OJT_GOAL) * 100);
            document.getElementById('progressBar').style.width = perc + "%";
            document.getElementById('percText').innerText = perc.toFixed(0) + "%";

            // Button Control Logic
            if (todayIn && todayOut) {
                document.getElementById('btnIn').classList.add('d-none');
                document.getElementById('btnOut').classList.add('d-none');
                document.getElementById('completedDay').classList.remove('d-none');
                document.getElementById('statusMsg').classList.add('d-none');
            } else if (todayIn) {
                document.getElementById('btnIn').classList.add('d-none');
                document.getElementById('btnOut').classList.remove('d-none');
                document.getElementById('statusMsg').innerText = "Logged IN at " + new Date(todayIn).toLocaleTimeString();
            } else {
                document.getElementById('btnIn').classList.remove('d-none');
                document.getElementById('btnOut').classList.add('d-none');
            }

            document.getElementById('loading').style.display = 'none';
        });
    }

    // 4. SAVE ACTION
    async function clockAction(type) {
        if (!confirm(`Confirm Clock ${type}?`)) return;
        const now = new Date();
        const data = {
            timestamp: now.getTime(),
            readableDate: now.toLocaleDateString(),
            type: type,
            site: document.getElementById('siteSelect').value,
            rule: document.getElementById('ruleSelect').value
        };
        await db.ref('logs').push(data);
        refreshApp();
    }

    document.getElementById('btnIn').onclick = () => clockAction("IN");
    document.getElementById('btnOut').onclick = () => clockAction("OUT");

    function exportData() {
        alert("This feature can generate a PDF in the next update!");
    }

    refreshApp();
</script>

</body>
</html>
